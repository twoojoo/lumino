# Tests and release packages for Linux, Windows and macOS.
# Every push/PR builds the packages as workflow artifacts; pushing a v* tag
# also publishes them as a GitHub release.
name: ci

on:
  push:
    # main pushes disabled for now (re-add `branches: [main]` to re-enable)
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GIO_LINUX_DEPS: >-
    libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libxkbcommon-dev
    libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libxfixes-dev libvulkan-dev

jobs:
  test:
    name: unit tests (linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $GIO_LINUX_DEPS
      - run: make test GIO_TAGS=

  integration:
    name: conformance of every adapter + UI screenshots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $GIO_LINUX_DEPS xvfb mesa-utils libgl1-mesa-dri
      # the database images fill most of the runner disk: drop preinstalled
      # SDKs we don't use
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # Oracle Free and Cassandra are too heavy for hosted runners: they run
      # in the local suite (make db-up)
      - name: development databases
        run: make db-up DBS="postgres cockroach mysql mariadb tidb mssql clickhouse firebird scylla mongo mongo-secure ferretdb shard-cfg shard-a shard-b mongos trino bastion"
      # headless Gio renders through EGL; Xvfb + Mesa llvmpipe provide it
      - run: xvfb-run -a make test-int GIO_TAGS=
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            .dev/shots/
            .dev/test-int-failures.txt
          if-no-files-found: ignore

  linux:
    name: package linux-${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          # arm64 hosted runners are free only for public repositories:
          # - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build packages (Docker, Ubuntu 22.04 baseline)
        run: make package-linux
      - name: smoke test (start under Xvfb, must stay up)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libegl1 libgles2 libgl1-mesa-dri \
            libwayland-client0 libwayland-egl1 libwayland-cursor0 libxkbcommon-x11-0 libx11-xcb1 libxcursor1
          set +e
          LUMINO_CONFIG_DIR=/tmp/lumino-smoke xvfb-run -a timeout 15 dist/linux-${{ matrix.arch }}/lumino </dev/null
          code=$?
          set -e
          [ "$code" = 124 ] || { echo "lumino exited early with $code"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: lumino-linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/THIRD_PARTY_NOTICES.txt

  windows:
    name: package windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: unit tests
        run: go test -tags dev ./internal/...
      - name: build packages (amd64 + arm64)
        run: ./scripts/package-windows.sh
      - name: smoke test (start, must stay up)
        shell: pwsh
        run: |
          & dist\windows-amd64\lumino.exe --version
          $env:LUMINO_CONFIG_DIR = "$env:RUNNER_TEMP\lumino-smoke"
          $p = Start-Process -FilePath dist\windows-amd64\lumino.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "lumino exited early with $($p.ExitCode)" }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: lumino-windows
          path: dist/*.zip

  macos:
    name: package macos
    runs-on: macos-14
    env:
      HAS_SIGNING_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: unit tests
        run: go test -tags dev ./internal/...
      - name: import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p ci "$kc"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$MACOS_NOTARY_APPLE_ID" ]; then
            xcrun notarytool store-credentials lumino --apple-id "$MACOS_NOTARY_APPLE_ID" \
              --team-id "$MACOS_NOTARY_TEAM_ID" --password "$MACOS_NOTARY_PASSWORD" --keychain "$kc"
            echo "MACOS_NOTARY_PROFILE=lumino" >> "$GITHUB_ENV"
          fi
      - name: build packages (universal app, dmg)
        run: make package-macos
      - name: smoke test (start, must stay up)
        run: |
          LUMINO_CONFIG_DIR="$RUNNER_TEMP/lumino-smoke" dist/macos/Lumino.app/Contents/MacOS/lumino </dev/null &
          pid=$!
          sleep 15
          kill -0 $pid || { wait $pid; echo "lumino exited early with $?"; exit 1; }
          kill $pid
      - uses: actions/upload-artifact@v4
        with:
          name: lumino-macos
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    name: github release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          pattern: lumino-*
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # lumino's self-updater installs only releases whose checksums verify
      # with the public key built into the app (internal/update)
      - name: sign checksums
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::secret UPDATE_SIGNING_KEY is missing: an unsigned release can't be installed by the updater"
            exit 1
          fi
          go run ./scripts/signsums sign dist/SHA256SUMS.txt
          pub="$(sed -n 's/^var PublicKey = "\(.*\)"/\1/p' internal/update/update.go)"
          go run ./scripts/signsums verify "$pub" dist/SHA256SUMS.txt
      - name: release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" \
            --jq .body > notes.md
          cat notes.md
      # the app updates from this repository's latest release (internal/update)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Lumino ${GITHUB_REF_NAME#v}" --notes-file notes.md \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
