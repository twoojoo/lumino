# .deb/.rpm metadata; scripts/package-linux.sh substitutes VERSION, ARCH and DIST.
name: lumino
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: none
section: devel
priority: optional
maintainer: twoojoo <giovanni.campeol.95@gmail.com>
description: |
  Fast, native database IDE: PostgreSQL, MySQL, MariaDB, SQLite, SQL Server,
  Oracle, ClickHouse, CockroachDB, TiDB, Firebird, Cassandra/ScyllaDB, Trino.
  SQL console with completion, streaming grids, table editing, DDL, SSH
  tunnels, TLS and an AI assistant.
homepage: https://github.com/twoojoo/lumino
license: GPL-3.0-or-later
depends:
  - libc6 (>= 2.34)
  - libwayland-client0
  - libwayland-egl1
  - libwayland-cursor0
  - libxkbcommon0
  - libegl1
  - libx11-6
  - libx11-xcb1
  - libxkbcommon-x11-0
  - libxcursor1
  - libxfixes3
# Vulkan is loaded at runtime when available (GPU backend), OpenGL ES otherwise
recommends:
  - libvulkan1
overrides:
  rpm:
    depends:
      - glibc >= 2.34
      - libwayland-client
      - libwayland-egl
      - libwayland-cursor
      - libxkbcommon
      - mesa-libEGL
      - libX11
      - libX11-xcb
      - libxkbcommon-x11
      - libXcursor
      - libXfixes
    recommends:
      - vulkan-loader
contents:
  - src: ${DIST}/linux-${ARCH}/lumino
    dst: /usr/bin/lumino
  - src: ${DIST}/THIRD_PARTY_NOTICES.txt
    dst: /usr/share/doc/lumino/THIRD_PARTY_NOTICES.txt
  - src: packaging/linux/lumino.desktop
    dst: /usr/share/applications/lumino.desktop
  - src: packaging/linux/lumino.metainfo.xml
    dst: /usr/share/metainfo/io.github.twoojoo.lumino.metainfo.xml
  - src: packaging/icons/lumino-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/lumino.png
  - src: packaging/icons/lumino-24.png
    dst: /usr/share/icons/hicolor/24x24/apps/lumino.png
  - src: packaging/icons/lumino-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/lumino.png
  - src: packaging/icons/lumino-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/lumino.png
  - src: packaging/icons/lumino-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/lumino.png
  - src: packaging/icons/lumino-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/lumino.png
  - src: packaging/icons/lumino-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/lumino.png
  - src: packaging/icons/lumino-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/lumino.png
